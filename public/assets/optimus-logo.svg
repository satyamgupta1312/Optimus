<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" fill="none">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="lw" x1="6" y1="6" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Icon: rounded square with 4 widget grid -->
  <rect x="2" y="2" width="40" height="40" rx="10" fill="url(#lg)"/>
  <rect x="9" y="9" width="10" height="10" rx="2.5" fill="url(#lw)"/>
  <rect x="23" y="9" width="10" height="10" rx="2.5" fill="url(#lw)" opacity="0.75"/>
  <rect x="9" y="23" width="10" height="10" rx="2.5" fill="url(#lw)" opacity="0.75"/>
  <rect x="23" y="23" width="10" height="10" rx="2.5" fill="url(#lw)" opacity="0.55"/>
  <!-- Text: OPTIMUS -->
  <text x="52" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="1.5" fill="#1E293B">OPTIMUS</text>
</svg>
